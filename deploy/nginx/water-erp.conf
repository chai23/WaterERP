# WaterERP — Nginx 單一入口（網域 + HTTPS）
# 由 deploy/scripts/generate-nginx-config.ps1 產生
# 正式網域範例：aoshyhcake.com.tw（請自行替換 server_name / 憑證檔名）

server {
    listen 80;
    server_name aoshyhcake.com.tw www.aoshyhcake.com.tw;

    location ^~ /.well-known/acme-challenge/ {
        root C:/Users/gj94e/Desktop/WaterERP/deploy/acme-www;
        default_type text/plain;
    }

    location / {
        return 301 https://aoshyhcake.com.tw$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aoshyhcake.com.tw www.aoshyhcake.com.tw;

    ssl_certificate     C:/Users/gj94e/Desktop/WaterERP/deploy/certs/aoshyhcake.com.tw-chain.pem;
    ssl_certificate_key C:/Users/gj94e/Desktop/WaterERP/deploy/certs/aoshyhcake.com.tw-key.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 後台 SPA（根路徑）
    root C:/Users/gj94e/Desktop/WaterERP/apps/web-admin/dist;
    index index.html;

    # API 反向代理（僅本機 Node）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 司機端 SPA（子路徑 /driver/）
    location = /driver {
        return 301 /driver/;
    }

    location /driver/ {
        alias C:/Users/gj94e/Desktop/WaterERP/apps/web-driver/dist/;
        index index.html;
        try_files $uri $uri/ /driver/index.html;
    }

    # LINE LIFF 訂水（子路徑 /liff/）
    location = /liff {
        return 301 /liff/;
    }

    location /liff/assets/ {
        alias C:/Users/gj94e/Desktop/WaterERP/apps/web-liff/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /liff/ {
        alias C:/Users/gj94e/Desktop/WaterERP/apps/web-liff/dist/;
        index index.html;
        try_files $uri $uri/ /liff/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 後台 SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
