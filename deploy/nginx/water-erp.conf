# WaterERP — Nginx（aoshyhcake.com.tw HTTPS 正式）
# 憑證：deploy/certs（win-acme / Let's Encrypt）

server {
    listen 80;
    server_name aoshyhcake.com.tw www.aoshyhcake.com.tw;

    location ^~ /.well-known/acme-challenge/ {
        root C:/Users/gj94e/Desktop/WaterERP/deploy/acme-www;
        default_type text/plain;
    }

    location / {
        return 301 https://aoshyhcake.com.tw$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aoshyhcake.com.tw www.aoshyhcake.com.tw;

    ssl_certificate     C:/Users/gj94e/Desktop/WaterERP/deploy/certs/aoshyhcake.com.tw-chain.pem;
    ssl_certificate_key C:/Users/gj94e/Desktop/WaterERP/deploy/certs/aoshyhcake.com.tw-key.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root C:/Users/gj94e/Desktop/WaterERP/apps/web-admin/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /driver { return 301 /driver/; }
    location /driver/ {
        alias C:/Users/gj94e/Desktop/WaterERP/apps/web-driver/dist/;
        index index.html;
        try_files $uri $uri/ /driver/index.html;
    }

    location = /liff { return 301 /liff/; }
    location /liff/ {
        alias C:/Users/gj94e/Desktop/WaterERP/apps/web-liff/dist/;
        index index.html;
        try_files $uri $uri/ /liff/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}